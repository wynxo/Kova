[project]
name = "kova"
version = "0.1.0"
description = "Your own private AI that lives on your computer"
readme = "README.md"
authors = [
    { name = "wynxo", email = "318229878+wynxo@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.16.1",
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tomli-w>=1.2.0",
    "typer>=0.29.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
kova = "kova.cli:app"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: needs a real model server (set KOVA_LIVE=1)"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]
