name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version-file: .python-version
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run the Windows installer tests
        if: runner.os == 'Windows'
        run: uv run pytest -q -rs tests/test_installers.py

      - name: Run tests
        run: uv run pytest -q

  visual:
    name: Visual (Chromium)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version-file: .python-version
          enable-cache: true

      - name: Install visual dependencies and Chromium
        run: uv run --locked --group visual playwright install chromium

      - name: Compare screenshots
        env:
          KOVA_VISUAL_REQUIRED: "1"
        run: uv run --locked --group visual pytest -q -m visual tests/visual

      - name: Upload screenshot differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: test-results/visual/
          if-no-files-found: ignore

  smoke:
    name: Smoke (packaged web UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version-file: .python-version
          enable-cache: true

      - name: Run the packaged web UI smoke test
        run: bash scripts/smoke.sh

  desktop:
    name: Desktop (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: desktop

      - name: Run tests
        run: node --test
        working-directory: desktop

      - name: Configure Electron sandbox for the CI runner
        run: |
          # Resolving the executable also downloads it if npm left it lazy-installed.
          electron_bin="$(node -p "require('./desktop/node_modules/electron')")"
          sandbox_helper="$(dirname "$electron_bin")/chrome-sandbox"
          test -f "$sandbox_helper"
          sudo chown root:root "$sandbox_helper"
          sudo chmod 4755 "$sandbox_helper"

      - name: Smoke-test Electron startup
        run: xvfb-run -a desktop/node_modules/.bin/electron scripts/desktop-startup.cjs

  privacy:
    name: Privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: No real paths, prompts or home-network addresses in the repository
        run: python scripts/privacy_check.py

      - name: No real paths, prompts or addresses in the PR title and description
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n\n%s\n' "$TITLE" "$BODY" > "$RUNNER_TEMP/pr.txt"
          python scripts/privacy_check.py --text "$RUNNER_TEMP/pr.txt" --redact
