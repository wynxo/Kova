<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Kova">
  <title>Kova</title>
  <!-- The app icon: the Kova mark, white on a near-black rounded square. This is
       the one asset that carries literal colours, because a favicon, an installed
       app icon and an OS launcher render outside the page and cannot read CSS
       variables. The values are the dark theme's bg-base and fg-default tokens. -->
  <rect width="120" height="120" rx="26" fill="#14121c"/>
  <g transform="translate(60 60) scale(.74) translate(-60 -60)" fill="none" stroke="#e8e6f0" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="60" cy="60" r="44" stroke-width="9"/>
    <path d="M40 21v78" stroke-width="10"/>
    <path d="M40 72l20-24 8 10 23-29" stroke-width="10"/>
    <path d="M50 60l41 31" stroke-width="10"/>
  </g>
</svg>
